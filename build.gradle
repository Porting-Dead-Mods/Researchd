plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'com.diffplug.spotless' version '8.10.2'

    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id "com.modrinth.minotaur" version "2.+"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()

    maven { url = 'https://jitpack.io' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.latvian.dev/releases' }

    // Jared's maven (JEI) and cursemaven (FTB) are kept for when those integrations come back.
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }

    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Integrations left out of the 26.1 build. Their code stays in the tree:
// - EMI, Immersive Engineering and Create have no 26.1.2 build yet
// - JEI and FTB Teams / FTB Library come back once their compat is ported to 26.1
sourceSets.main.java {
    exclude 'com/portingdeadmods/researchd/compat/EMICompat.java'
    exclude 'com/portingdeadmods/researchd/compat/JEICompat.java'
    exclude 'com/portingdeadmods/researchd/compat/ftbteams/**'
    exclude 'com/portingdeadmods/researchd/compat/immersiveengineering/**'
    exclude 'com/portingdeadmods/researchd/compat/jei/**'
    exclude 'com/portingdeadmods/researchd/mixins/create/**'
    exclude 'com/portingdeadmods/researchd/mixins/immersiveengineering/**'
}

// GameTests live in their own source set so they never ship in the mod jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()

            programArguments.addAll '--username', 'Developer', '--uuid', '123456781234123412341234567890ab'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()

            programArguments.addAll '--username', 'DeveloperThe2nd', '--uuid', '123456781234123412341234567890ac'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            // Its own game directory, so only the GameTest KubeJS scripts load, not the dev client's
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

var syncGameTestKubeJSScripts = tasks.register('syncGameTestKubeJSScripts', Sync) {
    from 'src/gametest/kubejs/server_scripts'
    into 'run/gametest/kubejs/server_scripts'
}

tasks.named('runGameTestServer').configure {
    dependsOn syncGameTestKubeJSScripts
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.github.Porting-Dead-Mods:Porting-Dead-Libs:${pdl_version}"
    //implementation files("pdl_cicd/portingdeadlibs-${pdl_version}-1.21.1.jar") // Local Deploy

    // Integration dependencies are out for now; see the source set excludes above.
    // JEI runs in the dev client without Researchd's compat, which comes back once it's ported to 26.1.
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // KubeJS stays optional: compat code only touches its classes once it's loaded.
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
    localRuntime "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    localRuntime "dev.latvian.mods:rhino:${rhino_version}"

    // JADE
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
}

def parts = pdl_version.tokenize('.')
def pdl_nextMinor = "${parts[0]}.${(parts[1].toInteger() + 1)}.0"

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pdl_version            : pdl_version,
            pdl_nextMinor          : pdl_nextMinor
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

spotless {
    enforceCheck = false // `build` formats the sources instead of failing on them

    java {
        target 'src/main/java/**/*.java'

        palantirJavaFormat('2.75.0') // runs on Java 25; 2.80+ would reformat text blocks
        removeUnusedImports()
        formatAnnotations()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('compileJava').configure {
    dependsOn tasks.named('spotlessApply')
}

java {
    withSourcesJar()
    withJavadocJar()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

if (System.getenv('CURSEFORGE_TOKEN')) {
    tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {

        apiToken = System.getenv('CURSEFORGE_TOKEN')
        disableVersionDetection()

        // Upload main jar
        def mainFile = upload(curseforge_project_id, jar)
        mainFile.changelog = System.getenv('CHANGELOG') ?: 'See GitHub for changes'
        mainFile.changelogType = 'markdown'
        mainFile.releaseType = System.getenv('RELEASE_TYPE') ?: 'release'
        mainFile.displayName = "${mod_id}-${mod_version}-${minecraft_version}"
        mainFile.addGameVersion minecraft_version
        mainFile.addModLoader 'NeoForge'
        mainFile.addEnvironment 'Client', 'Server'
        mainFile.addRequirement "porting-dead-libs"

        // Add sources and javadoc as additional files
        def sourcesFile = mainFile.withAdditionalFile(sourcesJar)
        sourcesFile.displayName = "${mod_id}-${mod_version}-${minecraft_version}-sources"

        def javadocFile = mainFile.withAdditionalFile(javadocJar)
        javadocFile.displayName = "${mod_id}-${mod_version}-${minecraft_version}-javadoc"
    }
}

if (System.getenv('MODRINTH_TOKEN')) {
    modrinth {
        token = System.getenv("MODRINTH_TOKEN")
        projectId = System.getenv("MODRINTH_PROJECT_SLUG")
        versionNumber = mod_version
        versionType = System.getenv('RELEASE_TYPE') ?: 'release'
        uploadFile = jar
        additionalFiles = [sourcesJar, javadocJar]
        changelog = System.getenv('CHANGELOG') ?: 'See GitHub for changes'
        gameVersions = [minecraft_version]
        loaders = ["neoforge"]
        dependencies {
            required.project "porting-dead-libs"
        }
    }
}